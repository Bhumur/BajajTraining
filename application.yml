spring:
  # --- Datasource Configuration ---
  datasource:
    # 1. Driver Class Name
    driverClassName: org.h2.Driver
    
    # 2. File-Based H2 URL
    # Data will be saved persistently to a file named 'mydb.mv.db' 
    # inside a 'data' folder in your project root.
    url: jdbc:h2:file:./data/mydb
    username: root
    password: root

  # --- JPA Configuration (Crucial: Disables ORM) ---
  jpa:
    # By setting ddl-auto to 'none', we prevent Hibernate from attempting 
    # to create or modify the schema. Schema management is handled by
    # your schema.sql file or manual JDBC code.
    hibernate:
      ddl-auto: none

  # --- H2 Console Configuration (Optional but Recommended) ---
  h2:
    console:
      # Enables the H2 web console
      enabled: true
      # Sets the console access path (e.g., http://localhost:8080/h2-console)
      path: /h2-console
