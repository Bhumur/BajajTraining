spring:
  datasource:
    driverClassName: org.h2.Driver
    # File-Based URL for persistence
    url: jdbc:h2:file:./data/mydb
    username: sa
    password: password

  # CRITICAL: Prevent JPA from interfering
  jpa:
    hibernate:
      ddl-auto: none
